<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle: {{ actividad.nombre }} - Deportes UNCA</title>
    <!-- Vinculamos Bootstrap 5-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">

                <div class="card shadow border-0">
                    <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center p-3">
                        <h2 class="h4 mb-0">{{ actividad.nombre }}</h2>
                        <span class="badge bg-info text-dark">ID: #{{ actividad.pk }}</span>
                    </div>
                    <div class="card-body p-4">
                        <h4 class="h6 text-muted mb-3">Descripción:</h4>
                        <p class="lead">{{ actividad.descripcion }}</p>

                        <div class="row bg-white p-3 rounded border my-4">
                            <div class="col-md-6 mb-2">
                                <p class="mb-0"><strong>Lugar de Práctica:</strong></p>
                                <p class="text-secondary mb-0">{{ actividad.lugar }}</p>
                            </div>
                            <div class="col-md-6 mb-2">
                                <p class="mb-0"><strong>Cupo Máximo:</strong></p>
                                <p class="text-secondary mb-0">{{ actividad.cupo }} vacantes</p>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a href="{% url 'lista_actividades' %}" class="btn btn-secondary">← Volver a la Lista</a>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
